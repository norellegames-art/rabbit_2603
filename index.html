<style>

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; width:100%; margin:0; padding:0; overflow-x:hidden}

body{
  font-family:system-ui,-apple-system, sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(124,58,237,.3), transparent 60%),

    linear-gradient(160deg, var(--bg1), var(--bg2));
  transition: background 1.5s ease;
}

/* MOOD & EFFECTS */
.mood-glow{ position: fixed; inset:0; pointer-events:none; z-index: -1; opacity:0; transition: 1s; }
.happy-mood .mood-glow{ opacity: 1; animation: moodPulse 2s ease-in-out infinite; background: radial-gradient(circle, rgba(124,58,237,0.4) 0%, transparent 70%); }
@keyframes moodPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; filter: saturate(2); } }
body.night-mode { background: linear-gradient(160deg, #050714, #0a1125) !important; }

.heart-particle{ position: fixed; pointer-events:none; font-size: 20px; animation: floatUp 1.2s ease-out forwards; z-index: 9999; transform: translate(-50%, -50%); }
@keyframes floatUp { 0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) translateY(-120px) scale(1.8) rotate(20deg); opacity: 0; } }

/* LAYOUT */
.wrap{ max-width:600px; margin:0 auto; padding:20px 16px 60px; }
header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom: 10px; }
h1{margin:0; font-size:clamp(22px, 6vw, 32px); line-height:1.2; transition: 0.5s;}
.sub{color:var(--muted); font-size:13px; margin-top:4px}
.badge{ display:inline-flex; align-items:center; justify-content:center; padding:8px 16px; min-height:32px; border-radius:999px; font-size:11px; font-weight: 600; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); }

/* GLASS CARDS */
.card{ margin-top:16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); backdrop-filter: blur(12px); padding: 18px; position: relative; }

/* 🐰 RABBIT & BUBBLE (FIXED) */
.pet-top{ position: relative; min-height: 370px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
#petBubble{
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: max-content; max-width: 90vw; min-width: 120px; /* Horizontal growth fix */
  padding: 14px 22px; border-radius: 20px; background: rgba(10, 10, 25, 0.95); border: 1.5px solid var(--gold); color: #fff; font-size: 15px; text-align: center; opacity: 0; pointer-events: none; transition: .35s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
}
#petBubble.show{ opacity: 1; transform: translateX(-50%) translateY(20px); }

.canvas{ position: relative; width: 260px; height: 230px; transition: 0.3s; touch-action: manipulation; outline: none; }
.rabbit-img{ width: 100%; height: 100%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 18px 28px rgba(0,0,0,.33)); }
@keyframes bounce{0%,100%{transform:scale(1)} 50%{transform:scale(1.05) translateY(-10px)}}
#rabbit.pet-react .rabbit-img{ animation: bounce 0.4s ease; }

/* CONTROLS */
.controls{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
button, .link-btn{ border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; padding: 15px; border-radius: 18px; font-size: 14px; text-align: center; transition: 0.25s; text-decoration: none; }
button.primary{ background: linear-gradient(135deg, var(--purple), var(--red)); border: none; font-weight: bold; }

/* ACHIEVEMENTS */
.achievements-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 10px 0; justify-items: center; }
.achievement-slot{ width: 68px; height: 68px; border-radius: 50%; background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 26px; transition: 0.35s; position: relative; }
.achievement-slot.unlocked{ background: rgba(124,58,237,0.2); border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(251,192,45,0.3); animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.achievement-slot.locked{ filter: grayscale(1) opacity(0.22); }
.ach-label{ position: absolute; bottom: -18px; font-size: 9px; color: var(--muted); }

/* MODAL */
#overlay{ display: none; position: fixed; inset:0; background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
#letterBox{ background: linear-gradient(135deg, #fffcf5, #fff); color: #4e342e; padding: 35px; border-radius: 30px; max-width: 450px; width: 100%; position: relative; line-height: 1.6; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
.letter-close{ position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 28px; color: #bbb; }

@media (max-width: 360px){ .controls{ grid-template-columns: 1fr; } }
</style>

  setTimeout(() => {
    petBubble.classList.remove("show");
    rabbitEl.classList.remove("pet-react");
    document.body.classList.remove("happy-mood");
  }, 2500);
  checkAchievements(true);
}

function spawnHeart(x, y) {
  const heart = document.createElement("div");
  heart.className = "heart-particle";
  heart.textContent = "❤️";
  heart.style.left = x + "px"; heart.style.top = y + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1200);
}

function openLetter(id) {
  letterContent.innerHTML = ACH_CONTENT[id] || "";
  overlay.style.display = "flex";
}

function checkAchievements(auto) {
  [99, 520, 999, 2301, 2409, 2603].forEach(m => {
    const slot = $("slot" + m);
    if (count >= m) {
      if (slot.classList.contains("locked") && auto) openLetter(m);
      slot.classList.remove("locked");
      slot.classList.add("unlocked");
      slot.onclick = () => openLetter(m);
    }
  });
  checkSecret();
}

function checkSecret() {
    const secretAch = { id: "jan23_2027", date: new Date(2027, 0, 23), slotId: "slotSecret" };
    const today = new Date();
    const isSecretDay = today.getFullYear() === 2027 && today.getMonth() === 0 && today.getDate() === 23;
    if (isSecretDay || localStorage.getItem("secret_unlocked") === "true") {
        const slot = $(secretAch.slotId);
        slot.classList.remove("locked"); slot.classList.add("unlocked");
        if (isSecretDay && localStorage.getItem("secret_unlocked") !== "true") {
            localStorage.setItem("secret_unlocked", "true"); openSecret();
        }
        slot.onclick = openSecret;
    }
}
function openSecret() {
    letterContent.innerHTML = "<h3>🕳️ 兔子洞：周年特别奖</h3><p>一年的陪伴，365天的守候。你真的找到了这个洞口。</p><p>我会一直在这里，只要你回头。</p>";
    overlay.style.display = "flex";
}

rabbitEl.onclick = (e) => {
    spawnHeart(e.clientX, e.clientY);
    speak(RABBIT_REACTIONS[Math.floor(Math.random()*RABBIT_REACTIONS.length)]);
};

document.querySelectorAll("button[data-monologue]").forEach(btn => {
  btn.onclick = () => {
    const pool = MONOLOGUE_POOLS[btn.dataset.monologue];
    speak(pool[Math.floor(Math.random()*pool.length)]);
  };
});

$("closeLetterBtn").onclick = () => overlay.style.display = "none";
overlay.onclick = (e) => { if(e.target === overlay) overlay.style.display = "none"; };

dayBadge.textContent = `💞 第 ${daysTogether()} 天`;
checkAchievements(false);

const hr = new Date().getHours();
if (hr < 12) title.textContent = "🌅 早安，我的宝贝";
else if (hr < 18) title.textContent = "🌤️ 下午好呀";
else title.textContent = "🌙 晚安，梦里见";
</script>
</body>
</html>
