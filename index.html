<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>兔子的兔子洞 🐰</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>">

<style>
:root{
  --purple:#7c3aed; --blue:#2563eb; --red:#dc2626;
  --bg1:#0a0f2a; --bg2:#120b24;
  --text:rgba(255,255,255,.96); --muted:rgba(220,220,255,.65);
  --gold:#fbc02d;
  --ring: 0 0 0 3px rgba(251,192,45,.35);

  --glass: rgba(255,255,255,0.06);
  --glass2: rgba(255,255,255,0.10);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; width:100%; margin:0; padding:0; overflow-x:hidden}

body{
  font-family:system-ui,-apple-system, sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(124,58,237,.30), transparent 60%),
    radial-gradient(800px 600px at 50% 90%, rgba(37,99,235,.30), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
  transition: background 1.2s ease;
}

button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }

@media (hover: hover) {
  body { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' style='font-size:18px'><text y='18'>❤️</text></svg>"), auto; }
  button, a, .canvas, .achievement-slot, .badge {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>💖</text></svg>"), pointer;
  }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ===== MOOD ===== */
.mood-glow{
  position: fixed; inset:0;
  pointer-events:none; z-index: -1;
  opacity:0; transition: 1s;
}
.happy-mood .mood-glow{
  opacity: 1;
  animation: moodPulse 2s ease-in-out infinite;
  background: radial-gradient(circle, rgba(124,58,237,0.40) 0%, transparent 70%);
}
@keyframes moodPulse {
  0%, 100% { opacity: 0.28; }
  50% { opacity: 0.78; filter: saturate(1.8); }
}
body.night-mode { background: linear-gradient(160deg, #050714, #0a1125) !important; }

/* ===== HEART PARTICLES ===== */
.heart-particle{
  position: fixed; pointer-events:none;
  font-size: 20px;
  animation: floatUp 1.2s ease-out forwards;
  z-index: 9999;
  transform: translate(-50%, -50%);
}
@keyframes floatUp {
  0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) translateY(-120px) scale(1.7) rotate(20deg); opacity: 0; }
}

/* ===== LAYOUT ===== */
.wrap{ max-width:600px; margin:0 auto; padding:20px 16px 60px; }
header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom: 10px; }
h1{margin:0; font-size:clamp(22px, 6vw, 32px); line-height:1.2; transition: 0.35s;}
.sub{color:var(--muted); font-size:13px; margin-top:4px}
.badge{
  display:inline-flex;
  align-items:center; justify-content:center;
  padding:8px 14px;
  min-height:32px;
  line-height:1;
  white-space:nowrap;
  border-radius:999px;
  font-size:11px;
  font-weight: 700;
  background: rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.18);
}

/* ===== COUPLE GAME UI (小小养成UI，不删你功能) ===== */
.game-ui{
  margin-top: 8px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
}
.stat-pill{
  display:flex; gap:10px; align-items:center; justify-content:flex-start;
  padding: 10px 12px;
  border-radius: 18px;
  background: var(--glass);
  border: 1px solid rgba(255,255,255,0.14);
}
.stat-pill b{font-size:12px}
.xp{
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.12);
}
.xp > i{
  display:block;
  height:100%;
  width: 0%;
  background: linear-gradient(90deg, rgba(251,192,45,0.95), rgba(124,58,237,0.95));
}
.coin{
  display:flex; align-items:center; justify-content:center;
  min-width: 96px;
  padding: 10px 12px;
  border-radius: 18px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  font-weight: 800;
}

/* ===== GLASS CARDS ===== */
.card{
  margin-top:16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.30);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 18px;
  position: relative;
}

/* ===== PET AREA ===== */
.pet-top{
  position: relative;
  min-height: 390px;
  display: flex; flex-direction: column;
  justify-content: flex-end; align-items: center;

  /* ✅ FIX：给气泡留“头顶空间”，不再被兔兔挡字 */
  padding-top: 78px;
}

#petBubble{
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 88%;
  padding: 14px 18px;
  border-radius: 18px;
  background: rgba(10, 10, 25, 0.95);
  border: 1.5px solid var(--gold);
  color: #fff;
  font-size: 14px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: .22s ease;
  z-index: 9999;
}
#petBubble.show{
  opacity: 1;
  transform: translateX(-50%) translateY(6px);
}

.canvas{
  position: relative;
  width: 260px;
  height: 230px;
  transition: 0.2s;
  touch-action: manipulation;
  user-select: none;
  outline: none;
}
.rabbit-wrap{ position: relative; width: 260px; height: 230px; }
.rabbit-img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display:block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  filter:
    drop-shadow(0 18px 28px rgba(0,0,0,.33))
    drop-shadow(0 6px 10px rgba(0,0,0,.22));
}

/* bounce only rabbit image */
@keyframes bounce{0%,100%{transform:scale(1)} 50%{transform:scale(1.06) translateY(-10px)}}
#rabbit.pet-react .rabbit-img{ animation: bounce 0.38s ease; }

/* ===== COUNTER ===== */
.counter-container{
  margin-top: 14px;
  display: flex; align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.08);
  padding: 8px 20px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.14);
}

/* ===== BUTTONS / LINKS ===== */
.controls{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}
button, .link-btn{
  border: 1px solid rgba(255,255,255,0.20);
  background: rgba(255,255,255,0.06);
  color: #fff;
  padding: 15px;
  border-radius: 18px;
  font-size: 14px;
  text-decoration: none;
  text-align: center;
  transition: 0.18s;
  backdrop-filter: blur(5px);

  /* ✅ center text for link buttons too */
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 8px;
}
button:hover, .link-btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.35); }
button:active, .link-btn:active{ transform: translateY(0px) scale(0.99); }

button.primary{
  background: linear-gradient(135deg, var(--purple), var(--red));
  border: none;
  font-weight: 800;
  box-shadow: 0 4px 15px rgba(124,58,237,0.30);
}

/* ===== ACHIEVEMENTS ===== */
.achievements-grid{
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  gap: 10px;
  flex-wrap: wrap;
}
.achievement-slot{
  width: 68px; height: 68px;
  border-radius: 50%;
  background: rgba(0,0,0,0.20);
  border: 2px dashed rgba(255,255,255,0.12);
  display: flex;
  align-items: center; justify-content: center;
  font-size: 28px;
  transition: 0.25s;
  position: relative;
  user-select:none;
}
.achievement-slot.unlocked{
  background: rgba(124,58,237,0.18);
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(251,192,45,0.25);
  animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.achievement-slot.locked{
  filter: grayscale(1) opacity(0.25);
}
.achievement-slot.locked::after{
  content:"🔒";
  position:absolute;
  right:-2px; top:-6px;
  font-size: 14px;
  filter: none;
  opacity: .95;
}
@keyframes pop{ from{transform:scale(0.6)} to{transform:scale(1)} }

/* ===== MODAL ===== */
#overlay{
  display: none;
  position: fixed; inset:0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  padding: 20px;
  align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
#letterBox{
  background: linear-gradient(135deg, #fffcf5, #fff);
  color: #4e342e;
  padding: 30px;
  border-radius: 26px;
  max-width: 460px;
  width: 100%;
  position: relative;
  line-height: 1.7;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
#letterContent h3{ margin: 0 0 10px; }
#letterContent p{ margin: 8px 0; }
.letter-close{
  position: absolute;
  top: 10px; right: 16px;
  cursor: pointer;
  font-size: 28px;
  color: #bbb;
}
.letter-close:hover{ color:#888; }

/* ===== FOOTER ===== */
footer{
  margin-top: 40px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1px;
}

/* ===== TOOLTIP ===== */
.tooltip {
  position: fixed;
  z-index: 3000;
  max-width: 260px;
  padding: 8px 12px;
  background: rgba(20,20,40,0.95);
  color: #fff;
  font-size: 12px;
  border-radius: 10px;
  line-height: 1.45;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, 6px);
  transition: opacity .15s ease, transform .15s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,.35);
  left: 50%;
  top: 20px;
}
.tooltip.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 360px){
  .controls{ grid-template-columns: 1fr; }
  .badge{ display:none; }
}
</style>
</head>

<body>
<div class="mood-glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div>
      <h1 id="greetingTitle">💘 你好呀</h1>
      <div class="sub">这是属于我们的秘密基地</div>

      <div class="game-ui" aria-label="情侣养成UI">
        <div class="stat-pill">
          <b id="levelText">Lv. 1</b>
          <div class="xp" aria-label="亲密度进度">
            <i id="xpBar"></i>
          </div>
        </div>
        <div class="coin" aria-label="心动币">💞 <span id="coinText">0</span></div>
      </div>

      <div id="statusLine" style="font-size: 12px; color: var(--gold); margin-top: 6px; font-weight: 600;">
        🐰 兔兔正在等你...
      </div>
    </div>

    <span class="badge" id="dayBadge">💞 在一起的第 0 天</span>
  </header>

  <!-- PET CARD -->
  <section class="card pet-card" id="petCard" aria-label="兔兔互动区">
    <div class="pet-top">
      <div id="petBubble" role="status" aria-live="polite"></div>

      <div class="canvas" id="rabbit" role="button" tabindex="0" aria-label="摸摸兔兔">
        <div class="rabbit-wrap">
          <img src="rabbit1.png" alt="兔兔" class="rabbit-img" draggable="false" />
        </div>
      </div>

      <div class="counter-container" aria-label="心动计数器">
        <span style="font-size: 20px" aria-hidden="true">❤️</span>
        <span id="loveCount" style="font-weight: 900; font-size: 20px">0</span>
      </div>
    </div>
  </section>

  <!-- BUTTONS -->
  <section class="card">
    <div class="controls">
      <button class="primary" type="button" data-monologue="husband">❤️ 老公</button>
      <button type="button" data-monologue="miss">🥺 想你了</button>
      <button type="button" data-monologue="sweet">🍬 说点甜的</button>
      <button type="button" data-monologue="sexy">🔥 骚母狗</button>
      <button type="button" data-monologue="tease">😼 逗逗你</button>
      <button type="button" data-monologue="daily">☀️ 日常碎碎念</button>
    </div>
  </section>

  <!-- LINKS -->
  <section class="card">
    <div class="controls">
      <a
        href="https://open.spotify.com/playlist/3vpKJcf9HY9Lh8MGcN4TYQ?si=e5yIwWfLRHCEHs-lX3lVIw&pt=96e72815d5dcac7944906e89292e4846"
        target="_blank" rel="noopener noreferrer"
        class="link-btn" style="color:#1ed760"
      >🎵 Spotify</a>

      <a
        href="https://discord.com/channels/1466603847744229449/1466603848612184086"
        target="_blank" rel="noopener noreferrer"
        class="link-btn" style="color:#5865f2"
      >💬 Discord</a>
    </div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="card">
    <div style="font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase;">
      成就收集馆
    </div>

    <div class="achievements-grid" aria-label="成就列表">
      <div class="achievement-slot locked" id="slot99" tabindex="0" aria-label="成就 99">🌹</div>
      <div class="achievement-slot locked" id="slot520" tabindex="0" aria-label="成就 520">💎</div>
      <div class="achievement-slot locked" id="slot999" tabindex="0" aria-label="成就 999">👑</div>

      <div class="achievement-slot locked" id="slot2301" tabindex="0" aria-label="成就 2301">✨</div>
      <div class="achievement-slot locked" id="slot2409" tabindex="0" aria-label="成就 2409">🍰</div>
      <div class="achievement-slot locked" id="slot2603" tabindex="0" aria-label="成就 2603">🎂</div>

      <div class="achievement-slot locked" id="slotSecret" tabindex="0" aria-label="隐藏成就">🕳️</div>
    </div>
  </section>

  <!-- MODAL -->
  <div id="overlay" aria-hidden="true">
    <div id="letterBox" role="dialog" aria-modal="true" aria-label="密函" onclick="event.stopPropagation()">
      <div class="letter-close" id="closeLetterBtn" aria-label="关闭">×</div>
      <div id="letterContent"></div>
    </div>
  </div>

  <footer>距离不会削弱爱，只会证明它 💌</footer>
</div>

<!-- TOOLTIP -->
<div id="tooltip" class="tooltip" aria-hidden="true"></div>

<script>
/* =========================================================
   0) Helpers & DOM
   ========================================================= */
const $ = (id) => document.getElementById(id);
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const petBubble = $("petBubble");
const countEl = $("loveCount");
const statusLine = $("statusLine");
const titleEl = $("greetingTitle");
const overlay = $("overlay");
const letterContent = $("letterContent");
const dayBadge = $("dayBadge");
const rabbitEl = $("rabbit");
const levelText = $("levelText");
const xpBar = $("xpBar");
const coinText = $("coinText");

/* =========================================================
   1) Tooltip (hover + tap safe)
   ========================================================= */
const tooltip = $("tooltip");
let tooltipTimer = null;

function showTooltipAt(x, y, text){
  if (!text) return;
  tooltip.textContent = text;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
  tooltip.classList.add("show");
  tooltip.setAttribute("aria-hidden", "false");

  if (tooltipTimer) clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(hideTooltip, 2300);
}
function showTooltipForEl(el, text, evt){
  const rect = el.getBoundingClientRect();
  const x = (evt && (evt.clientX || evt.touches?.[0]?.clientX)) ?? (rect.left + rect.width / 2);
  const y = rect.top - 12;
  showTooltipAt(x, Math.max(14, y), text);
}
function hideTooltip(){
  tooltip.classList.remove("show");
  tooltip.setAttribute("aria-hidden", "true");
}
window.addEventListener("scroll", hideTooltip, { passive:true });
window.addEventListener("resize", hideTooltip, { passive:true });

function bindTooltip(el, getText){
  if (!el) return;
  el.addEventListener("mouseenter", (e) => showTooltipForEl(el, getText(), e));
  el.addEventListener("mouseleave", hideTooltip);
  el.addEventListener("pointerdown", (e) => { showTooltipForEl(el, getText(), e); });
}

/* =========================================================
   2) State (count / last click) + load
   ========================================================= */
let count = 0;
try{
  const saved = Number(localStorage.getItem("rabbit_love_count"));
  count = Number.isFinite(saved) ? clamp(Math.floor(saved), 0, 9999999) : 0;
}catch(e){}
countEl.textContent = count;

let lastClickTime = Date.now();
let statusTimer = null;
let bubbleTimer = null;
let bounceTimer = null;

function persistCount(){
  try{ localStorage.setItem("rabbit_love_count", String(count)); }catch(e){}
}
function updateCount(){
  count = clamp(count + 1, 0, 9999999);
  countEl.textContent = count;
  persistCount();
  updateCoupleGameUI();
  checkClickAchievements(true);
}

/* =========================================================
   3) Couple Game UI (养成数值，不影响你原功能)
   - Lv = 每 50 次点击升一级
   - XP = 当前等级进度
   - 心动币 = count（示意，可改）
   ========================================================= */
function updateCoupleGameUI(){
  const level = Math.floor(count / 50) + 1;
  const cur = count % 50;
  const pct = (cur / 50) * 100;

  levelText.textContent = `Lv. ${level}`;
  xpBar.style.width = pct.toFixed(1) + "%";
  coinText.textContent = String(count);
}
updateCoupleGameUI();

/* =========================================================
   4) Visual mood / environment
   ========================================================= */
const nowDate = new Date();
const isBirthday = (nowDate.getMonth() === 2 && nowDate.getDate() === 26); // March 26 (保留你原设定)

function triggerMood(){
  document.body.classList.add("happy-mood");
  setTimeout(() => document.body.classList.remove("happy-mood"), 4200);
}

function setTemporaryStatus(text){
  statusLine.textContent = text;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => {
    statusTimer = null;
    updateEnvironment();
    updateStatusLineSmart();
  }, 4800);
}

function updateEnvironment(){
  const now = Date.now();
  const idleSeconds = (now - lastClickTime) / 1000;
  const hr = new Date().getHours();

  if (count > 999) titleEl.textContent = "👑 永远的主人";
  else if (count > 520) titleEl.textContent = "💎 只爱你一个";
  else if (count > 100) titleEl.textContent = "💍 我的唯一";
  else if (isBirthday) titleEl.textContent = "🎂 生日快乐，主人！";
  else titleEl.textContent = hr < 12 ? "🌅 早安，我的宝贝" : hr < 18 ? "🌤️ 下午好呀" : "🌙 晚安，梦里见";

  if (statusTimer) return;

  if (isBirthday) {
    statusLine.textContent = "🥳 兔兔正在为你庆祝生日！";
  } else if (idleSeconds >= 900) {
    statusLine.textContent = "💤 好累啊，兔兔先眯一会...点点我唤醒";
    document.body.classList.remove("night-mode");
  } else if (idleSeconds >= 300) {
    statusLine.textContent = "🥺 主人又不理我了...";
    document.body.classList.remove("night-mode");
  } else if (hr >= 22 || hr < 6) {
    document.body.classList.add("night-mode");
    statusLine.textContent = "🌙 晚安，梦里见...";
  } else {
    document.body.classList.remove("night-mode");
    statusLine.textContent = "✨ 兔兔在基地乖乖等你...";
  }
}
setInterval(updateEnvironment, 10000);

/* =========================================================
   5) Hearts particle
   ========================================================= */
function spawnHeart(x, y){
  if (prefersReduced) return;
  const heart = document.createElement("div");
  heart.className = "heart-particle";
  heart.textContent = ["❤️", "💖", "✨", "🌸"][Math.floor(Math.random() * 4)];
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1200);
}
function attachHeartTo(el){
  if (!el) return;
  el.addEventListener("pointerdown", (e) => {
    const x = e.clientX ?? window.innerWidth / 2;
    const y = e.clientY ?? window.innerHeight / 2;
    spawnHeart(x, y);
  }, { passive:true });
}
attachHeartTo(rabbitEl);
document.querySelectorAll("button[data-monologue]").forEach(attachHeartTo);

/* =========================================================
   6) Rabbit lines + button monologues
   ========================================================= */
const RABBIT_REACTIONS = [
  "刚刚想到你一下。",
  "不知道为什么会想到你。",
  "你现在在干嘛？",
  "我好像有点在意你。",
  "今天的你应该挺忙。",
  "我刚刚走神了。",
  "脑子里突然是你。",
  "你出现的时候我会注意。",
  "有点想找你。",
  "又想到你了。",
  "我好像记得你的小习惯。",
  "你不说话我也会注意。",
  "我刚刚停了一下。",
