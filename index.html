<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>兔子的兔子洞 🐰</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>">

<style>
:root{
  --purple:#7c3aed; --blue:#2563eb; --red:#dc2626;
  --bg1:#0a0f2a; --bg2:#120b24;
  --text:rgba(255,255,255,.96); --muted:rgba(220,220,255,.65);
  --gold:#fbc02d;
  --ring: 0 0 0 3px rgba(251,192,45,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; width:100%; margin:0; padding:0; overflow-x:hidden}

body{
  font-family:system-ui,-apple-system, sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(124,58,237,.3), transparent 60%),
    radial-gradient(800px 600px at 50% 90%, rgba(37,99,235,.3), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
  transition: background 1.5s ease;
}
button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }

@media (hover: hover) {
  body { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' style='font-size:18px'><text y='18'>❤️</text></svg>"), auto; }
  button, a, .canvas, .achievement-slot, .badge { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>💖</text></svg>"), pointer; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* MOOD */
.mood-glow{
  position: fixed; inset:0;
  pointer-events:none; z-index: -1;
  opacity:0; transition: 1s;
}
.happy-mood .mood-glow{
  opacity: 1;
  animation: moodPulse 2s ease-in-out infinite;
  background: radial-gradient(circle, rgba(124,58,237,0.4) 0%, transparent 70%);
}
@keyframes moodPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; filter: saturate(2); }
}
body.night-mode { background: linear-gradient(160deg, #050714, #0a1125) !important; }

/* HEART PARTICLES */
.heart-particle{
  position: fixed; pointer-events:none;
  font-size: 20px;
  animation: floatUp 1.2s ease-out forwards;
  z-index: 9999;
  transform: translate(-50%, -50%);
}
@keyframes floatUp {
  0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) translateY(-120px) scale(1.8) rotate(20deg); opacity: 0; }
}

/* LAYOUT */
.wrap{ max-width:600px; margin:0 auto; padding:20px 16px 60px; }
header{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom: 10px; }
h1{margin:0; font-size:clamp(22px, 6vw, 32px); line-height:1.2; transition: 0.5s;}
.sub{color:var(--muted); font-size:13px; margin-top:4px}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 16px;
  min-height:32px;
  line-height:1;
  white-space:nowrap;
  border-radius:999px;
  font-size:11px;
  font-weight: 600;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
}

/* GLASS CARDS */
.card{
  margin-top:16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 18px;
  position: relative;
}

/* 🐰 RABBIT */
.pet-top{
  position: relative;
  min-height: 370px;
  display: flex; flex-direction: column;
  justify-content: flex-end; align-items: center;
}
#petBubble{
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  max-width: 85%;
  padding: 14px 22px;
  border-radius: 20px;
  background: rgba(10, 10, 25, 0.95);
  border: 1.5px solid var(--gold);
  color: #fff;
  font-size: 15px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: .35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
}
#petBubble.show{ opacity: 1; transform: translateX(-50%) translateY(20px); }

.canvas{
  position: relative;
  width: 260px;
  height: 230px;
  transition: 0.3s;
  touch-action: manipulation;
  user-select: none;
  outline: none;
}

/* image rabbit */
.rabbit-wrap{ position: relative; width: 260px; height: 230px; }
.rabbit-img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display:block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  filter:
    drop-shadow(0 18px 28px rgba(0,0,0,.33))
    drop-shadow(0 6px 10px rgba(0,0,0,.22));
}

/* bounce only rabbit image */
@keyframes bounce{0%,100%{transform:scale(1)} 50%{transform:scale(1.05) translateY(-10px)}}
#rabbit.pet-react .rabbit-img{ animation: bounce 0.4s ease; }

/* BUTTONS */
.counter-container{
  margin-top: 15px;
  display: flex; align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.08);
  padding: 8px 20px;
  border-radius: 999px;
}
.controls{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}
button, .link-btn{
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: #fff;
  padding: 15px;
  border-radius: 18px;
  font-size: 14px;
  text-decoration: none;
  text-align: center;
  transition: 0.25s;
  backdrop-filter: blur(5px);
}
button:hover, .link-btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.35); }
button:active, .link-btn:active{ transform: translateY(0px) scale(0.99); }

button.primary{
  background: linear-gradient(135deg, var(--purple), var(--red));
  border: none;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(124,58,237,0.3);
}

/* ACHIEVEMENTS */
.achievements-grid{
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  gap: 10px;
  flex-wrap: wrap;
}
.achievement-slot{
  width: 68px; height: 68px;
  border-radius: 50%;
  background: rgba(0,0,0,0.2);
  border: 2px dashed rgba(255,255,255,0.1);
  display: flex;
  align-items: center; justify-content: center;
  font-size: 28px;
  transition: 0.35s;
}
.achievement-slot.unlocked{
  background: rgba(124,58,237,0.2);
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(251,192,45,0.3);
  animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.achievement-slot.locked{ filter: grayscale(1) opacity(0.22); }
@keyframes pop{ from{transform:scale(0.5)} to{transform:scale(1)} }

/* MODAL */
#overlay{
  display: none;
  position: fixed; inset:0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  padding: 20px;
  align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
#letterBox{
  background: linear-gradient(135deg, #fffcf5, #fff);
  color: #4e342e;
  padding: 35px;
  border-radius: 30px;
  max-width: 450px;
  width: 100%;
  position: relative;
  line-height: 1.6;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.letter-close{
  position: absolute;
  top: 15px; right: 20px;
  cursor: pointer;
  font-size: 28px;
  color: #bbb;
}
.letter-close:hover{ color:#888; }

footer{
  margin-top: 40px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1px;
}

/* ===== Custom Tooltip (Hover / Tap) ===== */
.tooltip {
  position: fixed;
  z-index: 3000;
  max-width: 260px;
  padding: 8px 12px;
  background: rgba(20,20,40,0.95);
  color: #fff;
  font-size: 12px;
  border-radius: 10px;
  line-height: 1.45;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, 6px);
  transition: opacity .15s ease, transform .15s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,.35);
  left: 50%;
  top: 20px;
}
.tooltip.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 360px){
  .controls{ grid-template-columns: 1fr; }
  .badge{ display:none; }
}
</style>
</head>

<body>
<div class="mood-glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div>
      <h1 id="greetingTitle">💘 你好呀</h1>
      <div class="sub">这是属于我们的秘密基地</div>
      <div id="statusLine" style="font-size: 12px; color: var(--gold); margin-top: 6px; font-weight: 500;">🐰 兔兔正在等你...</div>
    </div>
    <span class="badge" id="dayBadge">💞 在一起的第 0 天</span>
  </header>

  <section class="card pet-card" id="petCard" aria-label="兔兔互动区">
    <div class="pet-top">
      <div id="petBubble" role="status" aria-live="polite"></div>

      <div class="canvas" id="rabbit" role="button" tabindex="0" aria-label="摸摸兔兔">
        <div class="rabbit-wrap">
          <img src="rabbit1.png" alt="兔兔" class="rabbit-img" draggable="false" />
        </div>
      </div>

      <div class="counter-container" aria-label="心动计数器">
        <span style="font-size: 20px" aria-hidden="true">❤️</span>
        <span id="loveCount" style="font-weight: 800; font-size: 20px">0</span>
      </div>
    </div>
  </section>

  <!-- Buttons trigger rabbit monologue -->
  <section class="card">
    <div class="controls">
      <button class="primary" type="button" data-monologue="husband">❤️老公</button>
      <button type="button" data-monologue="miss">🥺想你了</button>
      <button type="button" data-monologue="sweet">🍬说点甜的</button>
      <button type="button" data-monologue="sexy">🔥骚母狗</button>
      <button type="button" data-monologue="tease">😼逗逗你</button>
      <button type="button" data-monologue="daily">☀️日常碎碎念</button>
    </div>
  </section>

  <!-- Spotify + Discord links -->
  <section class="card">
    <div class="controls">
      <a
        href="https://open.spotify.com/playlist/3vpKJcf9HY9Lh8MGcN4TYQ?si=e5yIwWfLRHCEHs-lX3lVIw&pt=96e72815d5dcac7944906e89292e4846"
        target="_blank" rel="noopener noreferrer"
        class="link-btn" style="color:#1ed760"
      >🎵 Spotify</a>

      <a
        href="https://discord.com/channels/1466603847744229449/1466603848612184086"
        target="_blank" rel="noopener noreferrer"
        class="link-btn" style="color:#5865f2"
      >💬 Discord</a>
    </div>
  </section>

  <!-- Achievements -->
  <section class="card">
    <div style="font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 12px; letter-spacing: 2px; text-transform: uppercase;">
      成就收集馆
    </div>
      <div class="achievements-grid">
      <div class="achievement-slot locked" id="slot99" tabindex="0">🌹</div>
      <div class="achievement-slot locked" id="slot520" tabindex="0">💎</div>
      <div class="achievement-slot locked" id="slot999" tabindex="0">👑</div>
      <div class="achievement-slot locked" id="slot2301" tabindex="0">✨</div>
      <div class="achievement-slot locked" id="slot2409" tabindex="0">🍰</div>
      <div class="achievement-slot locked" id="slot2603" tabindex="0">🎂</div>
      <div class="achievement-slot locked" id="slotSecret" tabindex="0">🕳️</div>
    </div>

  </section>

  <!-- Modal -->
  <div id="overlay" aria-hidden="true">
    <div id="letterBox" role="dialog" aria-modal="true" aria-label="密函" onclick="event.stopPropagation()">
      <div class="letter-close" id="closeLetterBtn" aria-label="关闭">×</div>
      <div id="letterContent"></div>
    </div>
  </div>

  <footer>距离不会削弱爱，只会证明它 💌</footer>
</div>

<!-- tooltip -->
<div id="tooltip" class="tooltip" aria-hidden="true"></div>

<script>
/* ========= helpers ========= */
const $ = (id) => document.getElementById(id);
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

const petBubble = $("petBubble");
const countEl = $("loveCount");
const statusLine = $("statusLine");
const title = $("greetingTitle");
const overlay = $("overlay");
const letterContent = $("letterContent");
const dayBadge = $("dayBadge");
const rabbitEl = $("rabbit");
const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ========= Tooltip (hover + tap safe) ========= */
const tooltip = $("tooltip");
let tooltipTimer = null;

function showTooltipAt(x, y, text){
  if (!text) return;
  tooltip.textContent = text;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
  tooltip.classList.add("show");
  tooltip.setAttribute("aria-hidden", "false");

  if (tooltipTimer) clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(hideTooltip, 2500);
}
function showTooltipForEl(el, text, evt){
  const rect = el.getBoundingClientRect();
  const x = (evt && (evt.clientX || evt.touches?.[0]?.clientX)) ?? (rect.left + rect.width / 2);
  const y = rect.top - 12;
  showTooltipAt(x, Math.max(14, y), text);
}
function hideTooltip(){
  tooltip.classList.remove("show");
  tooltip.setAttribute("aria-hidden", "true");
}
window.addEventListener("scroll", hideTooltip, { passive:true });
window.addEventListener("resize", hideTooltip, { passive:true });

function bindTooltip(el, getText){
  if (!el) return;

  el.addEventListener("mouseenter", (e) => showTooltipForEl(el, getText(), e));
  el.addEventListener("mouseleave", hideTooltip);

  // tap/click (mobile + desktop)
  el.addEventListener("pointerdown", (e) => {
    // don't block other handlers; just show tooltip
    showTooltipForEl(el, getText(), e);
  });
}

/* ========= 1) CONFIG & DATA ========= */
let count = 0;
try {
  const saved = Number(localStorage.getItem("rabbit_love_count"));
  count = Number.isFinite(saved) ? clamp(Math.floor(saved), 0, 9999999) : 0;
} catch(e) {}
countEl.textContent = count;

let lastClickTime = Date.now();
let statusTimer = null;

/* bubble robustness */
let bubbleTimer = null;
let bounceTimer = null;

const nowDate = new Date();
const isBirthday = (nowDate.getMonth() === 2 && nowDate.getDate() === 26); // March 26

/* ===== Unified rabbit reactions (SAFE STRINGS ONLY) ===== */
const RABBIT_REACTIONS = [
  "刚刚想到你一下。",
  "不知道为什么会想到你。",
  "你现在在干嘛？",
  "我好像有点在意你。",
  "今天的你应该挺忙。",
  "我刚刚走神了。",
  "脑子里突然是你。",
  "你出现的时候我会注意。",
  "有点想找你。",
  "又想到你了。",
  "我好像记得你的小习惯。",
  "你不说话我也会注意。",
  "我刚刚停了一下。",
  "我对你有点例外。",
  "你有点影响我。",
  "我没打算想这么多，但你出现了。",
  "你在就好。",
  "就是想到你。",
  "你靠近的时候我会乱。",
  "这种距离有点危险。",
  "你这样我会心跳。",
  "你是不是故意的？",
  "你别再靠过来…我会失守。",
  "今天也靠近我一点吧。"
];

/* ===== Button monologues (rabbit's inner voice) ===== */
const MONOLOGUE_POOLS = {
  husband: [
    "老公～我刚刚只是想叫你一声。",
    "老公～你不回我我会乱想的。",
    "老公～我可以黏你一下吗？",
    "老公～你是不是最疼我。",
    "老公～我现在有点离不开你。",
    "老公～你完了，我离不开你了。"
  ],
  miss: [
    "你不在的时候，我会把想你藏进每一次呼吸里。",
    "想你到有点委屈，但想到你又会笑出来。",
    "抱我一下，现在就要。",
    "靠过来…我想贴着你。",
    "别走，好不好。"
  ],
  sweet: [
    "你是我的偏爱，还是最最偏的那一个。",
    "我把我的心都交给你了，所以你要负责。",
    "你一出现，我就只想对你软。",
    "遇见你以后，我没想过别人。"
  ],
  sexy: [
    "你这种眼神…我受不了。",
    "你别靠这么近，我会不想乖。",
    "你是不是想看我乱？",
    "我现在一点都不想乖。",
    "再靠近一点…就别怪我黏上你。"
  ],
  tease: [
    "哼，你点这个按钮，是不是想听我撒娇？",
    "我知道你在想我~不许否认。",
    "被我抓到了：你离不开我。",
    "再点一下？我会更乖一点点。"
  ],
  daily: [
    "你今天吃饭了吗？要好好照顾自己。",
    "记得喝水呀，我会盯紧你的。",
    "今天有没有累到？累了就趴我怀里。",
    "你平安就好，我一直在。"
  ]
};

/* ========= 2) CORE LOGIC ========= */
function updateEnvironment() {
  const now = Date.now();
  const idleSeconds = (now - lastClickTime) / 1000;
  const hr = new Date().getHours();

  if (count > 520) title.textContent = "👑 永远的主人";
  else if (count > 100) title.textContent = "💍 我的唯一";
  else if (isBirthday) title.textContent = "🎂 生日快乐，主人！";
  else title.textContent = hr < 12 ? "🌅 早安，我的宝贝" : hr < 18 ? "🌤️ 下午好呀" : "🌙 晚安，梦里见";

  if (statusTimer) return;

  if (isBirthday) {
    statusLine.textContent = "🥳 兔兔正在为你庆祝生日！";
  } else if (idleSeconds >= 900) {
    statusLine.textContent = "💤 好累啊，兔兔先眯一会...点点我唤醒";
    document.body.classList.remove("night-mode");
  } else if (idleSeconds >= 300) {
    statusLine.textContent = "🥺 主人又不理我了...";
    document.body.classList.remove("night-mode");
  } else if (hr >= 22 || hr < 6) {
    document.body.classList.add("night-mode");
    statusLine.textContent = "🌙 晚安，梦里见...";
  } else {
    document.body.classList.remove("night-mode");
    statusLine.textContent = "✨ 兔兔在基地乖乖等你...";
  }
}
setInterval(updateEnvironment, 10000);

function spawnHeart(x, y) {
  if (prefersReduced) return;
  const heart = document.createElement("div");
  heart.className = "heart-particle";
  heart.textContent = ["❤️", "💖", "✨", "🌸"][Math.floor(Math.random() * 4)];
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1200);
}

function attachHeartTo(el) {
  el.addEventListener("pointerdown", (e) => {
    const x = e.clientX ?? window.innerWidth / 2;
    const y = e.clientY ?? window.innerHeight / 2;
    spawnHeart(x, y);
  }, { passive: true });
}

function persistCount() {
  try { localStorage.setItem("rabbit_love_count", String(count)); } catch(e) {}
}
function updateCount() {
  count = clamp(count + 1, 0, 9999999);
  countEl.textContent = count;
  persistCount();
  checkAchievements(true);
}

function triggerMood() {
  document.body.classList.add("happy-mood");
  setTimeout(() => document.body.classList.remove("happy-mood"), 5000);
}

function setTemporaryStatus(text) {
  statusLine.textContent = text;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => {
    statusTimer = null;
    updateEnvironment();
    updateStatusLineSmart();
  }, 5000);
}

/* ✅ Rabbit speaks (bubble) - robust against rapid presses */
function speak(text, statusText = "🐰 兔兔在和你说悄悄话…") {
  lastClickTime = Date.now();
  updateCount();

  if (bubbleTimer) { clearTimeout(bubbleTimer); bubbleTimer = null; }
  if (bounceTimer) { clearTimeout(bounceTimer); bounceTimer = null; }

  petBubble.textContent = text;
  petBubble.classList.add("show");

  rabbitEl.classList.remove("pet-react");
  void rabbitEl.offsetWidth; // replay animation
  rabbitEl.classList.add("pet-react");

  triggerMood();
  setTemporaryStatus(statusText);

  bounceTimer = setTimeout(() => rabbitEl.classList.remove("pet-react"), 700);
  bubbleTimer = setTimeout(() => petBubble.classList.remove("show"), 2400);
}

/* unified click interaction */
function interact() {
  const line = RABBIT_REACTIONS[Math.floor(Math.random() * RABBIT_REACTIONS.length)];
  speak(line, "💖 兔兔感受到你了…");
}

/* ========= 3) ACHIEVEMENTS（点击计数成就） ========= */
function openLetter(m) {
  const letters = {
    99: `
      <h3>🌹 长长久久勋章</h3>
      <p><b>“我们要一起走的路，进度条才刚开始呢。”</b></p>
      <p>99 代表长久，也代表我对你的耐心和偏爱。</p>

function closeLetter() {
  overlay.style.display = "none";
  overlay.setAttribute("aria-hidden", "true");
}

function setAchvBehavior(slot, tooltipText, onActivate){
  bindTooltip(slot, () => tooltipText);
  slot.onclick = (e) => { e.stopPropagation(); onActivate?.(); };
  slot.onkeydown = (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      onActivate?.();
    }
  };
}

const ACHIEVEMENTS = [99, 520, 999, 2301, 2409, 2603];

function checkAchievements(autoOpen = false) {
  ACHIEVEMENTS.forEach((m) => {
    const slot = document.getElementById("slot" + m);
    if (!slot) return;

    if (count >= m) {
      if (slot.classList.contains("locked")) {
        slot.classList.remove("locked");
        slot.classList.add("unlocked");
        if (autoOpen) openLetter(m);
      }

      bindTooltip(slot, () => `✅ 已解锁：${m} 次点击`);
      slot.onclick = (e) => {
        e.stopPropagation();
        openLetter(m);
      };
    } else {
      bindTooltip(slot, () => `🔒 解锁于 ${m} 次点击`);
      slot.onclick = (e) => {
        e.stopPropagation();
        speak(`还需要 ${m - count} 次点击解锁。`, "✨ 兔兔在数数…");
      };
    }
  });
}

/* =========================================================
   ✅ 在一起天数 + 里程碑系统（起始 26/01/2026，当天=第1天）
   ========================================================= */
const TOGETHER_START = new Date(2026, 0, 26); // 26/01/2026
const START_STR = "26/01/2026";

function startOfDay(d){
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}
function daysTogether(){
  const today = startOfDay(new Date());
  const start = startOfDay(TOGETHER_START);
  const diff = today - start;
  if (diff < 0) return 0;
  return Math.floor(diff / 86400000) + 1; // start date = day 1
}
function updateDayBadge(){
  const day = daysTogether();
  dayBadge.textContent = `💞 在一起的第 ${day} 天`;
}

bindTooltip(dayBadge, () => `开始于 ${START_STR}`);

const MILESTONES = [
  { day: 1,   badge: "💞 在一起的第 1 天",   status: "🫶 第一天也要甜甜的！",     msg: "从今天起，我们有了专属的第 1 天。", icon: "🫶" },

  { day: 99,  badge: "🌹 长长久久 99 天",    status: "🌹 99 天啦，继续长长久久", msg: "99 天：爱不减，反而更深。",          icon: "🌹", openLetter: 99 },
  { day: 100, badge: "💍 我们的第 100 天",   status: "💍 100 天：你是我的唯一",  msg: "100 天：我把偏爱都给你。",           icon: "💍" },
  { day: 365, badge: "👑 一周年纪念",        status: "👑 一周年：我们赢了",       msg: "一周年：谢谢你一直在。",             icon: "👑" },
  { day: 520, badge: "💎 520 天极致告白",    status: "💎 520 天：我爱你",         msg: "520 天：我愿意一直一直。",           icon: "💎", openLetter: 520 }
];

const DAILY_LINES = [
  "✨ 兔兔在基地乖乖等你...",
  "🥰 今天也要被我爱着。",
  "💗 想你想得不讲道理。",
  "🫧 过来，让我抱一下。",
  "🌙 晚一点也没关系，我一直在。"
];

function getMilestone(day){
  return MILESTONES.find(m => m.day === day) || null;
}
function getUnlockedKey(){ return "together_milestones_unlocked_v1"; }
function loadUnlocked(){
  try{
    return JSON.parse(localStorage.getItem(getUnlockedKey()) || "{}");
  }catch(e){ return {}; }
}
function saveUnlocked(obj){
  try{ localStorage.setItem(getUnlockedKey(), JSON.stringify(obj)); }catch(e){}
}

function updateStatusLineSmart(){
  if (statusTimer) return;
  const day = daysTogether();
  const ms = getMilestone(day);
  if (ms?.status) { statusLine.textContent = ms.status; return; }
  if (Math.random() < 0.35) {
    statusLine.textContent = DAILY_LINES[Math.floor(Math.random() * DAILY_LINES.length)];
  }
}

function unlockMilestoneIfNeeded(){
  const day = daysTogether();
  const ms = getMilestone(day);
  if (!ms) return;

  const unlocked = loadUnlocked();
  if (unlocked[String(day)]) return;

  unlocked[String(day)] = true;
  saveUnlocked(unlocked);

  // show badge text if milestone has custom badge
  if (ms.badge) dayBadge.textContent = ms.badge;

  speak(ms.msg || `🎉 达成第 ${day} 天！`, ms.status || "🎉 纪念日达成！");
  if (ms.openLetter) openLetter(ms.openLetter);
  triggerMood();
}

function scheduleNextMidnightRefresh(){
  const now = new Date();
  const next = new Date(now);
  next.setHours(24,0,0,50);
  const delay = next - now;

  setTimeout(() => {
    updateDayBadge();
    unlockMilestoneIfNeeded();
    updateStatusLineSmart();
    scheduleNextMidnightRefresh();
  }, delay);
}

/* =========================================================
   ✅ 隐藏成就：23/01/2027 点击兔兔（保留原设定）
   ========================================================= */
function isSameYMD(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
const SECRET_ACH = {
  id: "jan23_2027_520",
  date: new Date(2027, 0, 23),
  requireDaysTogether: 520,
  slotId: "slotSecret",
  icon: "🕳️✨",
  toast: "🕳️ 你在 23/01/2027 点了兔兔，而且我们已经一年了…（被你抓到了）",
  letterHTML:
    "<h3>🕳️ 兔子洞·隐藏成就</h3>" +
    "<p>这一下点击，是专属暗号。</p>" +
    "<p><b>23/01/2027</b>，而且我们已经走到 <b>520 天</b>。</p>" +
    "<p>你一出现，兔兔就认得你。🐇💞</p>"
};
function secretKey(id){ return `secret_achv_${id}_unlocked_v1`; }

function updateSecretTooltip(){
  const slot = $(SECRET_ACH.slotId);
  if (!slot) return;

  let unlocked = false;
  try { unlocked = (localStorage.getItem(secretKey(SECRET_ACH.id)) === "1"); } catch(e){}

  if (unlocked) {
    bindTooltip(slot, () => "✅ 已解锁：点击查看隐藏成就");
  } else {
    bindTooltip(slot, () => "🕳️ 隐藏成就：在 23/01/2027 点击兔兔，并且在一起 ≥ 520 天");
  }
}

function unlockSecretAchievement(def){
  try { if (localStorage.getItem(secretKey(def.id)) === "1") return; } catch(e){}
  try { localStorage.setItem(secretKey(def.id), "1"); } catch(e){}

  const slot = $(def.slotId);
  if (slot){
    slot.classList.remove("locked");
    slot.classList.add("unlocked");
    slot.textContent = def.icon || "✨";
    setAchvBehavior(slot, "✅ 已解锁：点击查看隐藏成就", () => {
      letterContent.innerHTML = def.letterHTML;
      overlay.style.display = "flex";
    });
  }

  speak(def.toast || "✨ 解锁隐藏成就！", "🕳️ 兔子洞被打开了…");
  triggerMood();

  letterContent.innerHTML = def.letterHTML;
  overlay.style.display = "flex";
}

function restoreSecretAchievement(){
  const slot = $(SECRET_ACH.slotId);
  if (!slot) return;

  let unlocked = false;
  try { unlocked = (localStorage.getItem(secretKey(SECRET_ACH.id)) === "1"); } catch(e){}

  if (unlocked){
    slot.classList.remove("locked");
    slot.classList.add("unlocked");
    slot.textContent = SECRET_ACH.icon;
    setAchvBehavior(slot, "✅ 已解锁：点击查看隐藏成就", () => {
      letterContent.innerHTML = SECRET_ACH.letterHTML;
      overlay.style.display = "flex";
    });
  } else {
    // keep locked look + explain on click
    setAchvBehavior(slot, "🕳️ 隐藏成就：满足条件才会出现", () => {
      speak("🕳️ 还没到时候哦…（隐藏成就要满足条件）", "🕳️ 兔子洞还没打开…");
    });
  }
}

function checkSecretOnRabbitClick(){
  const today = new Date();
  const dt = daysTogether();
  if (isSameYMD(today, SECRET_ACH.date) && dt >= SECRET_ACH.requireDaysTogether){
    unlockSecretAchievement(SECRET_ACH);
  }
}

/* Rabbit click */
rabbitEl.addEventListener("click", () => {

});
rabbitEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    checkSecretOnRabbitClick();
    interact();

});
