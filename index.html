<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>兔子的兔子洞 🐰</title>
<style>
:root{
  --purple:#7c3aed; --blue:#2563eb; --red:#dc2626;
  --bg1:#0a0f2a; --bg2:#120b24;
  --text:rgba(255,255,255,.96); --muted:rgba(220,220,255,.65);
  --gold: #fbc02d;
  --glass: rgba(255, 255, 255, 0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; transition: all 0.2s ease;}
html,body{height:100%; width:100%; margin:0; padding:0; overflow-x:hidden; background: var(--bg1);}

body{
  font-family: system-ui, -apple-system, sans-serif; color:var(--text);
  background: 
    radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.2) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(220, 38, 38, 0.15) 0%, transparent 40%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
}

/* BACKGROUND ANIMATION */
.floating-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

/* HEADER */
.wrap{ max-width:500px; margin:0 auto; padding:20px 20px 80px; position: relative; z-index: 1;}
header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 25px; }
h1{ font-size: 28px; margin:0; letter-spacing: -0.5px; }
.sub{ font-size: 13px; color: var(--muted); margin-top: 4px; }
.badge{ padding:6px 14px; border-radius:12px; font-size:12px; font-weight:600; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); color: var(--gold);}

/* RABBIT BUBBLE & FIX */
.pet-top{ position: relative; height: 380px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
#petBubble{
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(10px);
  width: max-content; max-width: 85vw; min-width: 140px;
  padding: 16px 24px; border-radius: 22px; 
  background: rgba(15, 15, 35, 0.9); border: 1.5px solid var(--gold);
  backdrop-filter: blur(10px); color: #fff; text-align: center;
  opacity: 0; pointer-events: none; z-index: 100; font-weight: 500;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
#petBubble.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

#rabbit{ cursor: pointer; position: relative; }
.rabbit-img{ width: 240px; height: 240px; object-fit: contain; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.4)); }
.pet-react .rabbit-img{ animation: bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes bounce{ 0%, 100% {transform: scale(1);} 50% {transform: scale(1.08) translateY(-15px);} }

.love-meter{ margin-top: 20px; background: var(--glass); padding: 8px 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display:flex; align-items:center; gap:8px; }
#loveCount{ font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }

/* CONTROLS */
.controls{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
button{ 
  border: 1px solid rgba(255,255,255,0.15); background: var(--glass); 
  color: #fff; padding: 18px 10px; border-radius: 20px; font-size: 14px; font-weight: 500;
  cursor: pointer; backdrop-filter: blur(5px);
}
button:active { transform: scale(0.94); background: rgba(255,255,255,0.2); }
button.primary{ background: linear-gradient(135deg, var(--purple), var(--red)); border: none; box-shadow: 0 8px 20px rgba(124,58,237,0.3); }

/* ACHIEVEMENTS */
.ach-title{ text-align: center; font-size: 11px; margin: 30px 0 15px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
.achievements-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px 15px; justify-items: center; }
.achievement-slot{ 
  width: 70px; height: 70px; border-radius: 24px; 
  background: rgba(0,0,0,0.4); border: 2px dashed rgba(255,255,255,0.1); 
  display: flex; align-items: center; justify-content: center; font-size: 28px; 
  position: relative; cursor: pointer; 
}
.achievement-slot.unlocked{ border: 2px solid var(--gold); background: rgba(251,192,45,0.1); box-shadow: 0 0 20px rgba(251,192,45,0.15); border-style: solid;}
.achievement-slot.locked{ filter: grayscale(1); opacity: 0.3; }
.ach-label{ position: absolute; bottom: -20px; font-size: 10px; font-weight: 700; color: var(--muted); }

/* MODAL */
#overlay{ display: none; position: fixed; inset:0; background: rgba(0,0,0,0.9); z-index: 1000; padding: 25px; align-items: center; justify-content: center; backdrop-filter: blur(12px); }
#letterBox{ 
  background: #fffcf5; color: #3e2723; padding: 40px 30px; border-radius: 32px; 
  max-width: 400px; width: 100%; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,1);
  transform: scale(0.9); animation: modalIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalIn { to {transform: scale(1);} }
.letter-close{ position: absolute; top: 20px; right: 20px; font-size: 24px; color: #d7ccc8; cursor: pointer; }
.wax-seal{ text-align: center; margin-top: 25px; font-size: 30px; opacity: 0.8; }

.heart-particle{ position: fixed; pointer-events:none; z-index: 9999; animation: floatUp 1s ease-out forwards; }
@keyframes floatUp { 0% {transform: translate(-50%,-50%) scale(1); opacity:1;} 100% {transform: translate(-50%,-150%) scale(1.5); opacity:0;} }
</style>
</head>
<body>

<div class="floating-hearts" id="bgLayer"></div>

<div class="wrap">
  <header>
    <div>
      <h1 id="greetingTitle">你好呀 💘</h1>
      <div class="sub" id="statusLine">兔兔在缝隙里偷看你...</div>
    </div>
    <div class="badge" id="dayBadge">💞 第 1 天</div>
  </header>

  <div class="pet-top">
    <div id="petBubble"></div>
    <div id="rabbit">
      <img src="rabbit1.png" alt="🐰" class="rabbit-img">
    </div>
    <div class="love-meter">
      <span>❤️</span>
      <span id="loveCount">0</span>
    </div>
  </div>

  <div class="controls">
    <button class="primary" onclick="handleAction('husband')">❤️ 老公</button>
    <button onclick="handleAction('miss')">🥺 想你了</button>
    <button onclick="handleAction('sweet')">🍬 说点甜的</button>
    <button onclick="handleAction('sexy')">🔥 骚母狗</button>
    <button onclick="handleAction('tease')">😼 逗逗你</button>
    <button onclick="handleAction('daily')">☀️ 日常碎碎念</button>
  </div>

  <div class="ach-title">成就收集馆</div>
  <div class="achievements-grid">
    <div class="achievement-slot locked" id="slot99">🌹<span class="ach-label">99</span></div>
    <div class="achievement-slot locked" id="slot520">💎<span class="ach-label">520</span></div>
    <div class="achievement-slot locked" id="slot999">👑<span class="ach-label">999</span></div>
    <div class="achievement-slot locked" id="slot2301">✨<span class="ach-label">2301</span></div>
    <div class="achievement-slot locked" id="slot2409">🍰<span class="ach-label">2409</span></div>
    <div class="achievement-slot locked" id="slot2603">🎂<span class="ach-label">2603</span></div>
  </div>
</div>

<div id="overlay" onclick="closeLetter()">
  <div id="letterBox" onclick="event.stopPropagation()">
    <div class="letter-close" onclick="closeLetter()">×</div>
    <div id="letterContent" style="white-space: pre-wrap; font-size: 16px; line-height: 1.8;"></div>
    <div class="wax-seal">💌</div>
  </div>
</div>

<script>
const MONOLOGUE_POOLS = {
  husband: [
    "老公～你现在是不是在想我呀",
    "老公～我刚刚只是想叫你一声",
    "老公～我不回我我会乱想的",
    "老公～我可以黏你一下吗",
    "老公～我现在整个人都是你的",
    "老公～你完了，我离不开你了"
  ],
  miss: [
    "你不在的时候，我会把想你藏进每一次呼吸里。",
    "想你到有点委屈，但想到你又会笑出来。",
    "我想靠着你，一直到天亮。",
    "抱我一下，现在就要。"
  ],
  sweet: [
    "你是我的偏爱，还是最最偏的那一个。",
    "我把我的心都交给你了，所以你要负责。",
    "你一出现，我就只想对你软。",
    "遇见你以后，我没想过别人。"
  ],
  sexy: [
    "过来，我给你一个很紧很久的抱抱。",
    "今天也靠近我一点吧。",
    "你是不是想看我乱？",
    "我现在一点都不想乖。",
    "你这种眼神，我受不了..."
  ],
  tease: [
    "哼，你点这个按钮，是不是想听我撒娇？",
    "我知道你在想我~不许否认。",
    "被我抓到了：你离不开我。",
    "再点一下？我会更乖一点点。"
  ],
  daily: [
    "你今天吃饭了吗？要好好照顾自己。",
    "记得喝水呀，我会盯紧你的。",
    "今天有没有累到？累了就趴我怀里。"
  ]
};

const ACH_DATA = {
  99: { title: "🌹 长长久久勋章", text: "“我们要一起走的路，进度条才刚开始呢。”\n\n99 代表长久，也代表我对你的耐心和偏爱。虽然我有时候有点小脾气，但我想陪你走过每一个 99。不许中途掉队，听到了吗？" },
  520: { title: "💎 直球告白奖励", text: "“滴！心动检测报告：”\n\n恭喜解锁 520 奖励！在这个全世界都在说爱你的日子，我决定简单粗暴一点：我爱你，而且只爱你。这个成就的有效期是——永久。" },
  999: { title: "👑 至尊真爱大奖", text: "“恭喜获得：全服唯一限定爱人认证。”\n\n999 是最高级的浪漫。感谢你在这个并不完美的世界里，给了我最完美的守护。你是我的超级英雄，也是我永远想赖着的港湾。爱你久久！" },
  2301: { title: "✨ 2301：初遇纪念", text: "成就达成：【命中注定的相遇】\n\n此时此刻，世界线发生了变动。感谢那天你出现在我的视野里，让我的生活从此开启了高甜模式。遇见你，是我这辈子最欧气（好运）的时刻！" },
  2409: { title: "🍰 2409：你的生日", text: "成就达成：【全宇宙最可爱降临】\n\n今天是你作为“我男朋友”陪我过的生日，这份福气就送给你啦！谢谢你一直宠着这个奇奇怪怪的我。余生请继续努力，争取全成就满分通关！" },
  2603: { title: "🎂 2603：他的生日", text: "成就达成：【人间理想·升级日】\n\n恭喜你又升级啦！虽然等级加了 1，但在我心里你永远是那个最帅的初始玩家。生日快乐，继续保持对我“单向奔赴”的特权哦，爱你！" }
};

let count = parseInt(localStorage.getItem("love_count") || "0");
document.getElementById("loveCount").innerText = count;

function speak(txt) {
  const b = document.getElementById("petBubble");
  const r = document.getElementById("rabbit");
  b.innerText = txt;
  b.classList.add("show");
  r.classList.add("pet-react");
  setTimeout(() => { b.classList.remove("show"); r.classList.remove("pet-react"); }, 2800);
}

function handleAction(key) {
  const pool = MONOLOGUE_POOLS[key];
  speak(pool[Math.floor(Math.random() * pool.length)]);
  incrementCount();
}

function incrementCount() {
  count++;
  document.getElementById("loveCount").innerText = count;
  localStorage.setItem("love_count", count);
  checkAchievements(true);
}

function checkAchievements(isNew) {
  Object.keys(ACH_DATA).forEach(key => {
    const num = parseInt(key);
    const slot = document.getElementById("slot" + num);
    if (count >= num) {
      if (slot.classList.contains("locked")) {
        slot.classList.remove("locked");
        slot.classList.add("unlocked");
        if(isNew) showLetter(num);
      }
      slot.onclick = () => showLetter(num);
    } else {
      slot.onclick = () => speak(`还差 ${num - count} 次心动解锁勋章...`);
    }
  });
}

function showLetter(num) {
  const data = ACH_DATA[num];
  document.getElementById("letterContent").innerHTML = `
    <div style="font-weight:800; color:var(--purple); font-size:20px; margin-bottom:15px;">${data.title}</div>
    <div style="color:#5d4037;">${data.text}</div>
  `;
  document.getElementById("overlay").style.display = "flex";
}

function closeLetter() { document.getElementById("overlay").style.display = "none"; }

// Background particles
function createHeart() {
  const h = document.createElement("div");
  h.innerText = Math.random() > 0.5 ? "❤️" : "✨";
  h.style.position = "fixed";
  h.style.left = Math.random() * 100 + "vw";
  h.style.top = "110vh";
  h.style.fontSize = Math.random() * 15 + 10 + "px";
  h.style.opacity = Math.random() * 0.5;
  h.style.transition = `transform ${Math.random() * 5 + 5}s linear, opacity 3s`;
  document.getElementById("bgLayer").appendChild(h);
  setTimeout(() => {
    h.style.transform = `translateY(-120vh) rotate(${Math.random() * 360}deg)`;
  }, 100);
  setTimeout(() => h.remove(), 8000);
}
setInterval(createHeart, 2000);

document.getElementById("rabbit").onclick = (e) => {
  const p = document.createElement("div");
  p.className = "heart-particle";
  p.innerText = "❤️";
  p.style.left = e.clientX + "px"; p.style.top = e.clientY + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1000);
  speak(["哎呀！", "被抓到了", "想我了吗？", "嘿嘿"][Math.floor(Math.random()*4)]);
  incrementCount();
};

// Initial state
const dayDiff = Math.floor((new Date() - new Date(2026,0,23)) / 86400000) + 1;
document.getElementById("dayBadge").innerText = `💞 第 ${dayDiff} 天`;
checkAchievements(false);

const hr = new Date().getHours();
const greeting = hr < 5 ? "熬夜不好哦 🌙" : hr < 11 ? "早安，老公 🌅" : hr < 17 ? "下午好呀 🌤️" : "晚安，梦里见 🌙";
document.getElementById("greetingTitle").innerText = greeting;
</script>
</body>
</html>
