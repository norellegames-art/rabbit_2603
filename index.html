<style>

  --text:rgba(255,255,255,.96); --muted:rgba(220,220,255,.65);
  --gold:#fbc02d;
  --ring: 0 0 0 3px rgba(251,192,45,.35);

  --glass: rgba(255,255,255,0.06);
  --glass2: rgba(255,255,255,0.10);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; width:100%; margin:0; padding:0; overflow-x:hidden}

body{
  font-family:system-ui,-apple-system, sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(124,58,237,.30), transparent 60%),
    radial-gradient(800px 600px at 50% 90%, rgba(37,99,235,.30), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
  transition: background 1.2s ease;
}

button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }

@media (hover: hover) {
  body { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' style='font-size:18px'><text y='18'>❤️</text></svg>"), auto; }
  button, a, .canvas, .achievement-slot, .badge {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' style='font-size:24px'><text y='24'>💖</text></svg>"), pointer;
  }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ===== MOOD ===== */
.mood-glow{
  position: fixed; inset:0;
  pointer-events:none; z-index: -1;
  opacity:0; transition: 1s;
}
.happy-mood .mood-glow{
  opacity: 1;
  animation: moodPulse 2s ease-in-out infinite;
  background: radial-gradient(circle, rgba(124,58,237,0.40) 0%, transparent 70%);
}
@keyframes moodPulse {
  0%, 100% { opacity: 0.28; }
  50% { opacity: 0.78; filter: saturate(1.8); }
}
body.night-mode { background: linear-gradient(160deg, #050714, #0a1125) !important; }

/* ===== HEART PARTICLES ===== */
.heart-particle{
  position: fixed; pointer-events:none;
  font-size: 20px;
  animation: floatUp 1.2s ease-out forwards;
  z-index: 9999;
  transform: translate(-50%, -50%);
}
@keyframes floatUp {
  0% { transform: translate(-50%, -50%) translateY(0) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) translateY(-120px) scale(1.7) rotate(20deg); opacity: 0; }
}

/* ===== LAYOUT ===== */
.wrap{ max-width:600px; margin:0 auto; padding:20px 16px 60px; }
header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom: 10px; }
h1{margin:0; font-size:clamp(22px, 6vw, 32px); line-height:1.2; transition: 0.35s;}
.sub{color:var(--muted); font-size:13px; margin-top:4px}
.badge{
  display:inline-flex;
  align-items:center; justify-content:center;
  padding:8px 14px;
  min-height:32px;
  line-height:1;
  white-space:nowrap;
  border-radius:999px;
  font-size:11px;
  font-weight: 700;
  background: rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.18);
}

/* ===== GLASS CARDS ===== */
.card{
  margin-top:16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.30);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 18px;
  position: relative;
}

/* ===== PET AREA ===== */
.pet-top{
  position: relative;
  min-height: 390px;
  display: flex; flex-direction: column;
  justify-content: flex-end; align-items: center;

  /* ✅ FIX：给气泡留“头顶空间”，不再被兔兔挡字 */
  padding-top: 78px;
}

#petBubble{
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 88%;
  padding: 14px 18px;
  border-radius: 18px;
  background: rgba(10, 10, 25, 0.95);
  border: 1.5px solid var(--gold);
  color: #fff;
  font-size: 14px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: .22s ease;
  z-index: 9999;
}
#petBubble.show{
  opacity: 1;
  transform: translateX(-50%) translateY(6px);
}

.canvas{
  position: relative;
  width: 260px;
  height: 230px;
  transition: 0.2s;
  touch-action: manipulation;
  user-select: none;
  outline: none;
}
.rabbit-wrap{ position: relative; width: 260px; height: 230px; }
.rabbit-img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display:block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  filter:
    drop-shadow(0 18px 28px rgba(0,0,0,.33))
    drop-shadow(0 6px 10px rgba(0,0,0,.22));
}

/* bounce only rabbit image */
@keyframes bounce{0%,100%{transform:scale(1)} 50%{transform:scale(1.06) translateY(-10px)}}
#rabbit.pet-react .rabbit-img{ animation: bounce 0.38s ease; }

/* ===== COUNTER ===== */
.counter-container{
  margin-top: 14px;
  display: flex; align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.08);
  padding: 8px 20px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.14);
}

/* ===== BUTTONS / LINKS ===== */
.controls{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 10px;
}
button, .link-btn{
  border: 1px solid rgba(255,255,255,0.20);
  background: rgba(255,255,255,0.06);
  color: #fff;
  padding: 15px;
  border-radius: 18px;
  font-size: 14px;
  text-decoration: none;
  text-align: center;
  transition: 0.18s;
  backdrop-filter: blur(5px);

  /* ✅ center text for link buttons too */
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 8px;
}
button:hover, .link-btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.35); }
button:active, .link-btn:active{ transform: translateY(0px) scale(0.99); }

button.primary{
  background: linear-gradient(135deg, var(--purple), var(--red));
  border: none;
  font-weight: 800;
  box-shadow: 0 4px 15px rgba(124,58,237,0.30);
}

/* ===== ACHIEVEMENTS ===== */
.achievements-grid{
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  gap: 10px;
  flex-wrap: wrap;
}
.achievement-slot{
  width: 68px; height: 68px;
  border-radius: 50%;
  background: rgba(0,0,0,0.20);
  border: 2px dashed rgba(255,255,255,0.12);
  display: flex;
  align-items: center; justify-content: center;
  font-size: 28px;
  transition: 0.25s;
  position: relative;
  user-select:none;
}
.achievement-slot.unlocked{
  background: rgba(124,58,237,0.18);
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(251,192,45,0.25);
  animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.achievement-slot.locked{
  filter: grayscale(1) opacity(0.25);
}
.achievement-slot.locked::after{
  content:"🔒";
  position:absolute;
  right:-2px; top:-6px;
  font-size: 14px;
  filter: none;
  opacity: .95;
}
@keyframes pop{ from{transform:scale(0.6)} to{transform:scale(1)} }

/* ===== MODAL ===== */
#overlay{
  display: none;
  position: fixed; inset:0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  padding: 20px;
  align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
#letterBox{
  background: linear-gradient(135deg, #fffcf5, #fff);
  color: #4e342e;
  padding: 30px;
  border-radius: 26px;
  max-width: 460px;
  width: 100%;
  position: relative;
  line-height: 1.7;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
#letterContent h3{ margin: 0 0 10px; }
#letterContent p{ margin: 8px 0; }
.letter-close{
  position: absolute;
  top: 10px; right: 16px;
  cursor: pointer;
  font-size: 28px;
  color: #bbb;
}
.letter-close:hover{ color:#888; }

/* ===== FOOTER ===== */
footer{
  margin-top: 40px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1px;
}

/* ===== TOOLTIP ===== */
.tooltip {
  position: fixed;
  z-index: 3000;
  max-width: 260px;
  padding: 8px 12px;
  background: rgba(20,20,40,0.95);
  color: #fff;
  font-size: 12px;
  border-radius: 10px;
  line-height: 1.45;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, 6px);
  transition: opacity .15s ease, transform .15s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,.35);
  left: 50%;
  top: 20px;
}
.tooltip.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 360px){
  .controls{ grid-template-columns: 1fr; }
  .badge{ display:none; }
}

   ========================================================= */
const tooltip = $("tooltip");
let tooltipTimer = null;

function showTooltipAt(x, y, text){
  if (!text) return;
  tooltip.textContent = text;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
  tooltip.classList.add("show");
  tooltip.setAttribute("aria-hidden", "false");

  if (tooltipTimer) clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(hideTooltip, 2300);
}
function showTooltipForEl(el, text, evt){
  const rect = el.getBoundingClientRect();
  const x = (evt && (evt.clientX || evt.touches?.[0]?.clientX)) ?? (rect.left + rect.width / 2);
  const y = rect.top - 12;
  showTooltipAt(x, Math.max(14, y), text);
}
function hideTooltip(){
  tooltip.classList.remove("show");
  tooltip.setAttribute("aria-hidden", "true");
}
window.addEventListener("scroll", hideTooltip, { passive:true });
window.addEventListener("resize", hideTooltip, { passive:true });

function bindTooltip(el, getText){
  if (!el) return;
  el.addEventListener("mouseenter", (e) => showTooltipForEl(el, getText(), e));
  el.addEventListener("mouseleave", hideTooltip);
  el.addEventListener("pointerdown", (e) => { showTooltipForEl(el, getText(), e); });
}

/* =========================================================
   2) State (count / last click) + load
   ========================================================= */
let count = 0;
try{

  count = Number.isFinite(saved) ? clamp(Math.floor(saved), 0, 9999999) : 0;

countEl.textContent = count;

let bubbleTimer = null;

  try{ localStorage.setItem("rabbit_love_count", String(count)); }catch(e){}

  statusLine.textContent = text;

function updateEnvironment(){
  const now = Date.now();
  const idleSeconds = (now - lastClickTime) / 1000;
  const hr = new Date().getHours();

  if (count > 999) titleEl.textContent = "👑 永远的主人";
  else if (count > 520) titleEl.textContent = "💎 只爱你一个";
  else if (count > 100) titleEl.textContent = "💍 我的唯一";
  else if (isBirthday) titleEl.textContent = "🎂 生日快乐，主人！";
  else titleEl.textContent = hr < 12 ? "🌅 早安，我的宝贝" : hr < 18 ? "🌤️ 下午好呀" : "🌙 晚安，梦里见";

  if (statusTimer) return;

  if (isBirthday) {
    statusLine.textContent = "🥳 兔兔正在为你庆祝生日！";
  } else if (idleSeconds >= 900) {
    statusLine.textContent = "💤 好累啊，兔兔先眯一会...点点我唤醒";
    document.body.classList.remove("night-mode");

    statusLine.textContent = "🥺 主人又不理我了...";
    document.body.classList.remove("night-mode");
  } else if (hr >= 22 || hr < 6) {
    document.body.classList.add("night-mode");
    statusLine.textContent = "🌙 晚安，梦里见...";
  } else {
    document.body.classList.remove("night-mode");
    statusLine.textContent = "✨ 兔兔在基地乖乖等你...";
  }
}

  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 1200);
}

    const y = e.clientY ?? window.innerHeight / 2;

function setSlotState(slot, unlocked){
  if (!slot) return;
  slot.classList.toggle("unlocked", !!unlocked);
  slot.classList.toggle("locked", !unlocked);
}

function checkClickAchievements(autoOpen=false){
  CLICK_ACH.forEach(m => {

    if (!slot) return;

    if (count >= m){
      setSlotState(slot, true);
      bindTooltip(slot, () => `✅ 已解锁：点击查看（${m}）`);
      slot.onclick = (e) => { e.stopPropagation(); openLetter(m); };
      slot.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLetter(m); }
      };
      if (autoOpen) {
        // 仅当“刚解锁”时弹窗：用一次性标记
        const k = `click_ach_opened_${m}_v1`;
        try{
          if (localStorage.getItem(k) !== "1"){
            localStorage.setItem(k,"1");
            openLetter(m);
          }
        }catch(e){}
      }
    }else{
      setSlotState(slot, false);
      bindTooltip(slot, () => `🔒 解锁条件：${m} 次点击（当前 ${count}）`);
      slot.onclick = (e) => { e.stopPropagation(); speak(`还需要 ${m - count} 次点击解锁。`, "✨ 兔兔在数数…"); };

  updateSecretTooltip();
}

const TOGETHER_START = new Date(2026, 0, 23); // ✅ Jan=0, 23/01/2026
const START_STR = "23/01/2026";

function startOfDay(d){
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}
function daysTogether(){
  const today = startOfDay(new Date());
  const start = startOfDay(TOGETHER_START);
  const diffMs = today - start;
  if (diffMs < 0) return 0;
  return Math.floor(diffMs / 86400000) + 1; // start day = Day 1
}
function updateDayBadge(){
  const day = daysTogether();
  dayBadge.textContent = `💞 在一起的第 ${day} 天`;
}

    bindTooltip(slot, () => "✅ 已解锁：点击查看隐藏成就");
    slot.onclick = (e) => { e.stopPropagation(); openSecretLetter(); };
    slot.onkeydown = (e) => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); openSecretLetter(); } };
  }else{
    setSlotState(slot, false);
    slot.textContent = "🕳️";
    bindTooltip(slot, () => "🕳️ 隐藏成就");
    slot.onclick = (e) => { e.stopPropagation(); speak("🕳️ 还没到时候哦…（隐藏成就要满足条件）", "🕳️ 兔子洞还没打开…"); };
    slot.onkeydown = (e) => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); speak("🕳️ 还没到时候哦…（隐藏成就要满足条件）", "🕳️ 兔子洞还没打开…"); } };
  }
}

function unlockSecretAchievement(){
  try{
    if (localStorage.getItem(secretKey(SECRET_ACH.id)) === "1") return;
    localStorage.setItem(secretKey(SECRET_ACH.id), "1");
  }catch(e){}

  speak(SECRET_ACH.toast, "🕳️ 兔子洞被打开了…");
  triggerMood();
  updateSecretTooltip();
  openSecretLetter();
}

function checkSecretOnRabbitClick(){
  const today = new Date();
  const dt = daysTogether();
  if (isSameYMD(today, SECRET_ACH.date) && dt >= SECRET_ACH.requireDaysTogether){
    unlockSecretAchievement();
  }
}

/* =========================================================
   10) Rabbit click handlers (click + keyboard)
   ========================================================= */
rabbitEl.addEventListener("click", () => {
  checkSecretOnRabbitClick();
  interactRabbit();
});
rabbitEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    checkSecretOnRabbitClick();
    interactRabbit();
  }
});

/* =========================================================
   11) Boot
   ========================================================= */
updateEnvironment();
updateDayBadge();
checkClickAchievements(false);
updateSecretTooltip();
updateStatusLineSmart();

setInterval(updateDayBadge, 30000);
</script>
