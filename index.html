<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>兔子的兔子洞 🐰</title>

<style>
/* =====================================================
   🎮 情侣养成游戏 UI · 全局变量
   ===================================================== */
:root{
  --purple:#7c3aed;
  --red:#dc2626;
  --bg1:#0a0f2a;
  --bg2:#120b24;
  --text:rgba(255,255,255,.96);
  --muted:rgba(220,220,255,.65);
  --gold:#fbc02d;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; }

/* =====================================================
   🌌 背景
   ===================================================== */
body{
  font-family: system-ui, -apple-system, sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(124,58,237,.3), transparent 60%),
    radial-gradient(800px 600px at 50% 90%, rgba(220,38,38,.25), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
}

/* 装饰层一律不吃点击 */
.mood-glow,
.tooltip,
.heart-particle{
  pointer-events:none !important;
}

/* =====================================================
   📦 布局
   ===================================================== */
.wrap{
  max-width:600px;
  margin:0 auto;
  padding:20px 16px 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

h1{ margin:0; font-size:26px; }
.sub{ font-size:13px; color:var(--muted); }

.badge{
  padding:8px 16px;
  border-radius:999px;
  font-size:12px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
}

/* =====================================================
   🐰 兔兔区
   ===================================================== */
.pet-top{
  margin-top:20px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#petBubble{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  padding:14px 22px;
  border-radius:20px;
  background:rgba(15,15,35,.95);
  border:1.5px solid var(--gold);
  opacity:0;
  transition:.3s;
  z-index:100;
}
#petBubble.show{ opacity:1; transform:translateX(-50%) translateY(20px); }

/* ⚠️ 强制兔兔为最高点击层 */
#rabbit{
  position:relative;
  z-index:999;
  cursor:pointer;
}
#rabbit, #rabbit *{
  pointer-events:auto !important;
}

.rabbit-img{
  width:260px;
  height:230px;
  object-fit:contain;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.4));
}

/* 弹跳 */
@keyframes bounce{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.06) translateY(-12px); }
}
#rabbit.pet-react .rabbit-img{
  animation:bounce .4s ease;
}

/* =====================================================
   ❤️ 心动计数
   ===================================================== */
.counter{
  margin-top:16px;
  padding:8px 20px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  display:flex;
  gap:8px;
  font-weight:800;
}

/* =====================================================
   🎛️ 按钮
   ===================================================== */
.controls{
  margin-top:20px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:white;
  font-size:14px;
}
button.primary{
  background:linear-gradient(135deg,var(--purple),var(--red));
  border:none;
}

/* =====================================================
   🏆 成就
   ===================================================== */
.achievements{
  margin-top:24px;
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:12px;
}
.achievement{
  width:68px;
  height:68px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  border:2px dashed rgba(255,255,255,.15);
  opacity:.3;
}
.achievement.unlocked{
  opacity:1;
  border:2px solid var(--gold);
  background:rgba(124,58,237,.25);
}

/* =====================================================
   📜 弹窗
   ===================================================== */
#overlay{
  position:fixed;
  inset:0;
  display:none;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
  z-index:2000;
}
#letterBox{
  background:#fff;
  color:#333;
  padding:32px;
  border-radius:28px;
  max-width:420px;
}
.close{
  position:absolute;
  top:16px;
  right:20px;
  font-size:26px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div>
    <h1 id="title">💘 你好呀</h1>
    <div class="sub" id="status">兔兔在等你</div>
  </div>
  <div class="badge" id="dayBadge">💞 在一起的第 1 天</div>
</header>

<!-- 🐰 兔兔 -->
<div class="pet-top">
  <div id="petBubble"></div>
  <div id="rabbit">
    <img src="rabbit1.png" class="rabbit-img" />
  </div>
  <div class="counter">❤️ <span id="count">0</span></div>
</div>

<!-- 🎛️ 按钮 -->
<div class="controls">
  <button class="primary" data-key="husband">❤️ 老公</button>
  <button data-key="miss">🥺 想你了</button>
  <button data-key="sweet">🍬 说点甜的</button>
  <button data-key="sexy">🔥 骚母狗</button>
  <button data-key="tease">😼 逗逗你</button>
  <button data-key="daily">☀️ 日常碎碎念</button>
</div>

<!-- 🏆 成就 -->
<div class="achievements">
  <div class="achievement" id="a99">🌹</div>
  <div class="achievement" id="a520">💎</div>
  <div class="achievement" id="a999">👑</div>
  <div class="achievement" id="a2301">✨</div>
  <div class="achievement" id="a2409">🍰</div>
  <div class="achievement" id="a2603">🎂</div>
  <div class="achievement" id="aSecret">🕳️</div>
</div>

</div>

<!-- 📜 弹窗 -->
<div id="overlay">
  <div id="letterBox">
    <div class="close" onclick="closeLetter()">×</div>
    <div id="letter"></div>
  </div>
</div>

<script>
/* =====================================================
   📦 状态
   ===================================================== */
const $ = id => document.getElementById(id);
let count = Number(localStorage.getItem("love")||0);
$("count").innerText = count;

/* =====================================================
   📅 在一起天数（23/01/2026）
   ===================================================== */
const START = new Date(2026,0,23);
function daysTogether(){
  const d = new Date();
  d.setHours(0,0,0,0);
  const s = new Date(START);
  s.setHours(0,0,0,0);
  return Math.floor((d-s)/86400000)+1;
}
$("dayBadge").innerText = `💞 在一起的第 ${daysTogether()} 天`;

/* =====================================================
   🐰 说话
   ===================================================== */
function speak(text){
  $("petBubble").innerText=text;
  $("petBubble").classList.add("show");
  $("rabbit").classList.remove("pet-react");
  void $("rabbit").offsetWidth;
  $("rabbit").classList.add("pet-react");

  count++;
  localStorage.setItem("love",count);
  $("count").innerText=count;

  setTimeout(()=> $("petBubble").classList.remove("show"),2200);
  checkAchievements();
}

/* =====================================================
   🎛️ 按钮逻辑
   ===================================================== */
const POOL={
  husband:["老公～我在","老公别走","我只黏你"],
  miss:["我想你","靠过来","别离我太远"],
  sweet:["你是偏爱","只想对你软"],
  sexy:["再靠近一点","我不想乖"],
  tease:["被我抓到了","你逃不掉"],
  daily:["记得喝水","我陪你"]
};
document.querySelectorAll("button[data-key]").forEach(b=>{
  b.addEventListener("pointerdown",()=>{
    const p=POOL[b.dataset.key];
    speak(p[Math.floor(Math.random()*p.length)]);
  });
});

/* =====================================================
   🐰 兔兔点击（核心）
   ===================================================== */
$("rabbit").addEventListener("pointerdown",(e)=>{
  e.preventDefault();
  speak("你摸到我了。");
});

/* =====================================================
   🏆 成就
   ===================================================== */
function unlock(id){ $(id).classList.add("unlocked"); }
function checkAchievements(){
  if(count>=99) unlock("a99");
  if(count>=520) unlock("a520");
  if(count>=999) unlock("a999");
}

/* =====================================================
   📜 弹窗
   ===================================================== */
function closeLetter(){ $("overlay").style.display="none"; }
</script>

</body>
</html>
