<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>兔子的兔子洞 🐰</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐰</text></svg>">

<style>
:root{
  --purple:#7c3aed;
  --red:#dc2626;
  --bg1:#0a0f2a;
  --bg2:#120b24;
  --text:rgba(255,255,255,.96);
  --muted:rgba(220,220,255,.65);
  --gold:#fbc02d;
  --ring: 0 0 0 3px rgba(251,192,45,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}

body{
  font-family:system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% 15%, rgba(124,58,237,.3), transparent 60%),
    radial-gradient(800px 600px at 50% 90%, rgba(37,99,235,.3), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  transition:background 1.2s ease;
}

/* ===== layout ===== */
.wrap{max-width:600px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(22px,6vw,32px)}
.sub{font-size:13px;color:var(--muted)}
.badge{
  padding:8px 14px;
  border-radius:999px;
  font-size:11px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
}

.card{
  margin-top:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  backdrop-filter:blur(12px);
  padding:18px;
}

/* ===== rabbit ===== */
.pet-top{
  position:relative;
  min-height:360px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
}

.rabbit-wrap{
  position:relative;
  width:260px;
  user-select:none;
}
.rabbit-img{
  width:100%;
  display:block;
  pointer-events:none;
  filter:
    drop-shadow(0 18px 28px rgba(0,0,0,.35))
    drop-shadow(0 6px 10px rgba(0,0,0,.2));
}

@keyframes bounce{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05) translateY(-10px)}
}
#rabbit.pet-react .rabbit-img{animation:bounce .4s ease}

/* speech bubble */
#petBubble{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  max-width:85%;
  padding:14px 22px;
  border-radius:20px;
  background:rgba(10,10,25,.95);
  border:1.5px solid var(--gold);
  opacity:0;
  transition:.35s cubic-bezier(.18,.88,.32,1.27);
}
#petBubble.show{
  opacity:1;
  transform:translateX(-50%) translateY(20px);
}

/* counter */
.counter{
  margin-top:14px;
  display:flex;
  gap:10px;
  align-items:center;
  background:rgba(255,255,255,.08);
  padding:8px 20px;
  border-radius:999px;
}

/* buttons */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
button{
  padding:14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);
  color:#fff;
  font-size:14px;
  cursor:pointer;
}
button.primary{
  background:linear-gradient(135deg,var(--purple),var(--red));
  border:none;
  font-weight:bold;
}

/* hearts */
.heart{
  position:fixed;
  font-size:20px;
  pointer-events:none;
  animation:float 1.2s ease-out forwards;
}
@keyframes float{
  from{opacity:1;transform:translateY(0) scale(1)}
  to{opacity:0;transform:translateY(-120px) scale(1.8)}
}

/* modal */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  align-items:center;
  justify-content:center;
}
#letter{
  background:#fff;
  color:#4e342e;
  padding:30px;
  border-radius:24px;
  max-width:420px;
}
</style>
</head>

<body>
<div class="wrap">
<header>
  <div>
    <h1 id="title">💘 你好呀</h1>
    <div class="sub">这是属于我们的秘密基地</div>
    <div id="status" style="color:var(--gold);font-size:12px">🐰 兔兔正在等你…</div>
  </div>
  <span class="badge" id="dayBadge">💞 在一起的第 0 天</span>
</header>

<section class="card">
  <div class="pet-top">
    <div id="petBubble"></div>

    <div class="rabbit-wrap" id="rabbit" tabindex="0">
      <img src="rabbit.png" class="rabbit-img" alt="rabbit">
    </div>

    <div class="counter">
      ❤️ <span id="count" style="font-weight:800">0</span>
    </div>
  </div>
</section>

<section class="card">
  <div class="controls">
    <button class="primary" data-talk="random">🎲 随机惊喜</button>
    <button data-talk="miss">🥺 想你了</button>
    <button data-talk="sweet">🍬 说点甜的</button>
    <button data-talk="comfort">🫂 抱抱我</button>
    <button data-talk="tease">😼 逗逗你</button>
    <button data-talk="daily">☀️ 日常碎碎念</button>
  </div>
  <div id="msg" style="margin-top:14px;color:var(--muted);min-height:40px"></div>
</section>

<footer style="margin-top:40px;text-align:center;color:var(--muted);font-size:11px">
  距离不会削弱爱，只会证明它 💌
</footer>
</div>

<script>
/* ===== state ===== */
let count = Number(localStorage.getItem("love")||0);
const countEl = document.getElementById("count");
countEl.textContent = count;

const rabbit = document.getElementById("rabbit");
const bubble = document.getElementById("petBubble");
const msg = document.getElementById("msg");

/* ===== rabbit monologue ===== */
const RABBIT_LINES = [
  "你来了，我就安心了。",
  "你一出现，我就被安抚了。",
  "我在这里，一直都在。",
  "你不用说话，我懂。",
  "只要是你，我都会回应。",
  "今天也靠近我一点吧。"
];

/* ===== button monologues ===== */
const TALK = {
  random:[
    "我想把今天也偷偷塞进你怀里。",
    "你是我所有偏爱里的唯一。",
    "你一来，我世界就亮了。"
  ],
  miss:[
    "我真的很想你。",
    "不是随便想，是停下来想。",
    "想你想到有点委屈。"
  ],
  sweet:[
    "你不用多好，我就是喜欢你。",
    "我会站在你这边，永远。",
    "你一笑，我就什么都答应。"
  ],
  comfort:[
    "过来，靠一下。",
    "你已经做得很好了。",
    "累了就让我抱着。"
  ],
  tease:[
    "你是不是又想我了？",
    "被我抓到你点这个了。",
    "承认吧，你离不开我。"
  ],
  daily:[
    "记得喝水了吗？",
    "今天过得怎么样？",
    "外面冷不冷？"
  ]
};

/* ===== helpers ===== */
function heart(x,y){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💖","✨","🌸"][Math.floor(Math.random()*4)];
  h.style.left=x+"px";h.style.top=y+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1200);
}
function inc(){
  count++;countEl.textContent=count;
  localStorage.setItem("love",count);
}
function react(text){
  inc();
  bubble.textContent=text;
  bubble.classList.add("show");
  rabbit.classList.add("pet-react");
  setTimeout(()=>rabbit.classList.remove("pet-react"),700);
  setTimeout(()=>bubble.classList.remove("show"),2400);
}

/* ===== rabbit click (single behavior) ===== */
rabbit.addEventListener("click",e=>{
  heart(e.clientX,e.clientY);
  react(RABBIT_LINES[Math.floor(Math.random()*RABBIT_LINES.length)]);
});

/* ===== buttons ===== */
document.querySelectorAll("[data-talk]").forEach(b=>{
  b.addEventListener("click",e=>{
    heart(e.clientX,e.clientY);
    const pool=TALK[b.dataset.talk];
    msg.textContent=pool[Math.floor(Math.random()*pool.length)];
  });
});
</script>
</body>
</html>
