<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>兔子的兔子洞 🐰</title>

<style>
/* ===================== THEME ===================== */
:root{
  --bg1:#0a0f2a; --bg2:#120b24;
  --purple:#7c3aed; --red:#dc2626;
  --gold:#fbc02d;
  --text:rgba(255,255,255,.96);
  --muted:rgba(220,220,255,.65);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:
    radial-gradient(800px 600px at 20% 20%, rgba(124,58,237,.3), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
}

/* ===================== LAYOUT ===================== */
.wrap{max-width:600px;margin:auto;padding:18px}
.card{
  margin-top:16px;
  padding:18px;
  border-radius:24px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
}
header{display:flex;justify-content:space-between;gap:12px}
.badge{
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  background:rgba(255,255,255,.1);
}

/* ===================== RABBIT ===================== */
.pet-top{display:flex;flex-direction:column;align-items:center;min-height:360px}
.canvas{width:260px;height:230px;outline:none}
.rabbit-img{
  width:100%;height:100%;
  object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.4));
}
#petBubble{
  opacity:0;
  margin-bottom:10px;
  padding:12px 18px;
  border-radius:16px;
  border:1px solid var(--gold);
  background:#0a0a1a;
  transition:.3s;
}
#petBubble.show{opacity:1}

/* ===================== CONTROLS ===================== */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
button,a{
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);
  color:#fff;
  text-decoration:none;
  cursor:pointer;
}
button.primary{
  background:linear-gradient(135deg,var(--purple),var(--red));
  border:none;
  font-weight:700;
}

/* ===================== ACHIEVEMENTS ===================== */
.achievements-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.achievement-slot{
  width:64px;height:64px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  background:rgba(0,0,0,.2);
  border:2px dashed rgba(255,255,255,.2);
}
.achievement-slot.unlocked{
  border:2px solid var(--gold);
  background:rgba(124,58,237,.25);
}

/* ===================== MODAL ===================== */
#overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  align-items:center;justify-content:center;
}
#letterBox{
  max-width:420px;
  padding:30px;
  border-radius:24px;
  background:#fff;
  color:#333;
}
.letter-close{float:right;cursor:pointer;font-size:24px}
</style>
</head>

<body>
<div class="wrap">

<header>
  <div>
    <h2 id="greetingTitle">💘 你好呀</h2>
    <div id="statusLine" style="font-size:13px;color:var(--gold)">🐰 兔兔在等你</div>
  </div>
  <div class="badge" id="dayBadge">💞 在一起的第 0 天</div>
</header>

<!-- ===================== RABBIT ===================== -->
<section class="card">
  <div class="pet-top">
    <div id="petBubble"></div>
    <div class="canvas" id="rabbit" tabindex="0">
      <img src="rabbit1.png" class="rabbit-img" alt="兔兔">
    </div>
    <div style="margin-top:10px;font-size:20px">❤️ <span id="loveCount">0</span></div>
  </div>
</section>

<!-- ===================== BUTTONS ===================== -->
<section class="card">
  <div class="controls">
    <button class="primary" data-mono="husband">❤️ 老公</button>
    <button data-mono="miss">🥺 想你了</button>
    <button data-mono="sweet">🍬 说点甜的</button>
    <button data-mono="sexy">🔥 撩我</button>
    <button data-mono="tease">😼 逗你</button>
    <button data-mono="daily">☀️ 日常</button>
  </div>
</section>

<!-- ===================== LINKS ===================== -->
<section class="card">
  <div class="controls">
    <a href="https://open.spotify.com" target="_blank">🎵 Spotify</a>
    <a href="https://discord.com" target="_blank">💬 Discord</a>
  </div>
</section>

<!-- ===================== ACHIEVEMENTS ===================== -->
<section class="card">
  <div class="achievements-grid">
    <div class="achievement-slot locked" id="slot99">🌹</div>
    <div class="achievement-slot locked" id="slot520">💎</div>
    <div class="achievement-slot locked" id="slot999">👑</div>
    <div class="achievement-slot locked" id="slot2301">✨</div>
    <div class="achievement-slot locked" id="slot2409">🍰</div>
    <div class="achievement-slot locked" id="slot2603">🎂</div>
    <div class="achievement-slot locked" id="slotSecret">🕳️</div>
  </div>
</section>

</div>

<!-- ===================== MODAL ===================== -->
<div id="overlay">
  <div id="letterBox">
    <span class="letter-close" id="closeLetter">×</span>
    <div id="letterContent"></div>
  </div>
</div>

<script>
"use strict";

/* ===================== HELPERS ===================== */
function $(id){return document.getElementById(id)}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

/* ===================== STATE ===================== */
var count = Number(localStorage.getItem("rabbit_count")||0);
$("loveCount").textContent = count;

/* ===================== DATA ===================== */
var REACTIONS = [
  "刚刚想到你。",
  "你靠太近了。",
  "我会乱。",
  "你是不是故意的？",
  "我有点离不开你了。"
];

var MONO = {
  husband:["老公～我想你了。","老公你抱我。"],
  miss:["我在想你。","现在就想见你。"],
  sweet:["你是我的偏爱。","我只对你这样。"],
  sexy:["你别这样看我。","我会失控的。"],
  tease:["你点这个干嘛～","被我抓到了。"],
  daily:["记得吃饭。","我一直在。"]
};

/* ===================== CORE ===================== */
function speak(text){
  count++;
  localStorage.setItem("rabbit_count",count);
  $("loveCount").textContent = count;
  var b=$("petBubble");
  b.textContent=text;
  b.classList.add("show");
  setTimeout(function(){b.classList.remove("show")},2000);
  checkAchievements();
}

function interact(){
  speak(rand(REACTIONS));
}

/* ===================== EVENTS ===================== */
$("rabbit").onclick = interact;
$("rabbit").onkeydown=function(e){
  if(e.key==="Enter"||e.key===" "){e.preventDefault();interact()}
};

document.querySelectorAll("button[data-mono]").forEach(function(btn){
  btn.onclick=function(){
    speak(rand(MONO[btn.dataset.mono]));
  };
});

/* ===================== DAYS ===================== */
var START=new Date(2026,0,26);
function daysTogether(){
  var d=new Date();d.setHours(0,0,0,0);
  var s=new Date(START);s.setHours(0,0,0,0);
  var diff=d-s;
  return diff<0?0:Math.floor(diff/86400000)+1;
}
function updateDay(){
  $("dayBadge").textContent="💞 在一起的第 "+daysTogether()+" 天";
}
updateDay();
setInterval(updateDay,60000);

/* ===================== ACHIEVEMENTS ===================== */
var ACH=[99,520,999,2301,2409,2603];
function checkAchievements(){
  ACH.forEach(function(n){
    var slot=$("slot"+n);
    if(count>=n){
      slot.classList.add("unlocked");
      slot.onclick=function(){
        $("letterContent").innerHTML="<h3>成就 "+n+"</h3>";
        $("overlay").style.display="flex";
      };
    }
  });
}

/* ===================== MODAL ===================== */
$("closeLetter").onclick=function(){
  $("overlay").style.display="none";
};
$("overlay").onclick=function(e){
  if(e.target===this)this.style.display="none";
};

checkAchievements();
</script>
</body>
</html>
